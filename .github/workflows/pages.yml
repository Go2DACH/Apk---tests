name: Deploy GitHub Pages

on:
  push:
    branches: ["claude/fresh-start-v9zow4"]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "data/**"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js data assets tools mobile desktop README.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
