name: Build Windows Installer

on:
  push:
    branches: ["claude/fresh-start-v9zow4"]
    paths:
      - "prosthetic_slicer/**"
      - "build/**"
      - "app_main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run core tests
        run: python tests/test_core.py

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm build/prosthetic_slicer.spec

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NonPlanarSiliconeSlicer-Setup
          path: dist_installer/*.exe
          if-no-files-found: error

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: NonPlanarSiliconeSlicer-portable
          path: dist/NonPlanarSiliconeSlicer/**
